<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Solvnt Gestión</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png?v=4" />
  <link rel="apple-touch-icon" href="/favicon.png?v=4" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#080808" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <script>
    // Solo para tests automatizados (?e2e=1): en navegadores headless/background
    // requestAnimationFrame no dispara y las transiciones quedan colgadas.
    if (new URLSearchParams(location.search).has('e2e')) {
      // MessageChannel no sufre el clamp de timers de pestañas en background
      var rafQ = [], rafId = 1, rafCancel = {};
      var rafCh = new MessageChannel();
      rafCh.port1.onmessage = function () {
        var q = rafQ; rafQ = [];
        for (var i = 0; i < q.length; i++) if (!rafCancel[q[i].id]) q[i].cb(performance.now());
      };
      window.requestAnimationFrame = function (cb) { var id = rafId++; rafQ.push({ id: id, cb: cb }); rafCh.port2.postMessage(0); return id; };
      window.cancelAnimationFrame = function (id) { rafCancel[id] = true; };
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
